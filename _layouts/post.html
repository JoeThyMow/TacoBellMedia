---
layout: default
---
<article class="article"><a class="back" href="{{ '/articles/' | relative_url }}">← All articles</a><p class="eyebrow">{{ page.category | default: 'News' }}</p><h1>{{ page.title }}</h1>{% if page.description %}<p class="deck">{{ page.description }}</p>{% endif %}<p class="byline">By {{ page.author | default: 'Taco Bell Media' }} · {{ page.date | date: '%B %-d, %Y' }}</p>{% if page.image %}<img class="hero" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% endif %}<div class="article-body">{{ content }}</div></article>
